esphome:
  name: esphome-temp9
  friendly_name: Temp9

  on_boot:
    priority: 400
    then:
      - light.turn_on:
          id: status_led
          brightness: 25%
          red: 0%
          green: 0%
          blue: 100%

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf
    version: 5.3.1
    platform_version: 6.9.0

logger:
  hardware_uart: UART0
  baud_rate: 115200
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_api_key 

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: "TestBench"
      password: !secret wifi_password
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${friendly_name}
    password: !secret wifi_captive_password

  on_connect:
    then:
      - light.turn_on:
          id: status_led
          brightness: 25%
          red: 0%
          green: 100%
          blue: 0%

  on_disconnect:
    then:
      - light.turn_on:
          id: status_led
          brightness: 25%
          red: 100%
          green: 0%
          blue: 0%

captive_portal:

web_server:
  local: True
  
switch:
  - platform: restart
    name: "Device Restart"

  - platform: gpio
    pin: GPIO6
    name: "LED A"

  - platform: template
    name: "krb_switch_buzzer_virtual"
    optimistic: true
    turn_on_action:
    - output.turn_on: buzzer_output
        #in here we set the frequency, but first we had to turn the buzzer on as stated in https://esphome.io/components/output/ledc
    - output.ledc.set_frequency:
          id: buzzer_output
          frequency: "2441Hz"
       #am just a newbie, so i dont exactly why the code below needs to be used, however it does not work without it
       # in documention i have found " This action sets the float output to the given level when executed"
       #which does not tell much to me
    - output.set_level:
          id: buzzer_output
          level: "90%"
    turn_off_action:
    - output.turn_off: buzzer_output


sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 30s
    entity_category: diagnostic
    filters:
      - throttle: 10min
  - platform: uptime
    type: seconds
    name: Uptime Sensor
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - throttle: 600s

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    name: "RGB LED"
    id: status_led
    default_transition_length: 0.5s

binary_sensor:
  - platform: gpio
    pin: GPIO16
    name: "allume"
    filters:
      - delayed_on_off: 1s


output:
 - platform: ledc
   pin: GPIO10
   id: buzzer_output  
   # frequency deleted from output as this will be set in switch 
   # frequency: 2300hz

